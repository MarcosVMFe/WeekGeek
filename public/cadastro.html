<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cadastro – Rap Geek</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/conta.css">
<script src="./js/sessao.js"></script>
</head>
<body>
<header class="top">
  <nav>
    <a href="index.html#o-que-e">O que é</a>
    <a href="index.html#caracteristicas">Características</a>
    <a href="index.html#cantores">Cantores</a>
    <a href="index.html#sugestao-sec">Sorteio</a>
    <a href="jogar.html">Jogar</a>
    <a href="index.html#faq">Dúvidas</a>
    <a class="nav-conta" href="login.html">Entrar</a>
    <a class="nav-conta" href="cadastro.html" aria-current="page">Cadastre-se</a>
  </nav>
</header>

<main class="pagina-conta">
  <section class="area-conta">
    <div class="card-conta">
      <h1>Bem-vindo!</h1>
      <p class="subtitulo">Crie a sua conta para entrar na cena.</p>

      <div class="card_erro" id="cardErro" role="alert">
        <span id="mensagem_erro"></span>
      </div>

      <form class="formulario" onsubmit="return cadastrar()" novalidate>
        <div class="campo">
          <label for="nome_input">Nome</label>
          <input id="nome_input" type="text" placeholder="Seu nome" autocomplete="name">
        </div>
        <div class="campo">
          <label for="email_input">E-mail</label>
          <input id="email_input" type="email" placeholder="meuemail@gmail.com" autocomplete="email">
        </div>
        <div class="campo">
          <label for="senha_input">Senha</label>
          <input id="senha_input" type="password" placeholder="******" autocomplete="new-password">
        </div>
        <div class="campo">
          <label for="confirmacao_senha_input">Confirmação da senha</label>
          <input id="confirmacao_senha_input" type="password" placeholder="******" autocomplete="new-password">
        </div>
        <button class="btn" type="submit" id="botao_cadastrar">Cadastrar</button>
      </form>

      <div id="div_aguardar" class="loading-div">
        <span class="spinner" aria-hidden="true"></span> Aguarde...
      </div>
      <div id="div_erros_login" class="erros-login"></div>

      <p class="troca-conta">Já tem conta? <a href="login.html">Entre</a></p>
    </div>
  </section>
</main>

<footer>Feito por fãs, para fãs. Site informativo sem fins lucrativos.</footer>

<script>
  var temporizadorMensagem;
  var enviando = false;

  function mostrarMensagem(texto, sucesso) {
    cardErro.style.display = "block";
    cardErro.classList.toggle("sucesso", !!sucesso);
    mensagem_erro.textContent = texto;

    clearTimeout(temporizadorMensagem);
    temporizadorMensagem = setTimeout(sumirMensagem, 5000);
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }

  function limparCampos() {
    nome_input.value = "";
    email_input.value = "";
    senha_input.value = "";
    confirmacao_senha_input.value = "";
  }

  function cadastrar() {
    if (enviando) return false;

    var nomeVar = nome_input.value.trim();
    var emailVar = email_input.value.trim();
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;

    if (nomeVar == "" || emailVar == "" || senhaVar == "" || confirmacaoSenhaVar == "" ) {
      mostrarMensagem("Preencha todos os campos para se cadastrar.");
      return false;
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVar)) {
      mostrarMensagem("Digite um e-mail válido, como meuemail@gmail.com.");
      return false;
    }


    if (senhaVar != confirmacaoSenhaVar) {
      mostrarMensagem("A senha e a confirmação da senha precisam ser iguais.");
      return false;
    }

    enviando = true;
    botao_cadastrar.disabled = true;
    aguardar();

    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          mostrarMensagem("Cadastro realizado com sucesso! Redirecionando para tela de Login...", true);

          setTimeout(function () {
            window.location = "login.html";
          }, 2000);

          limparCampos();
        } else {
          throw resposta.status;
        }
      })
      .catch(function (erro) {
        console.log("#ERRO: " + erro);
        if (erro === 409) {
          mostrarMensagem("Este e-mail já está cadastrado. Tente entrar.");
        } else {
          mostrarMensagem("Não foi possível concluir o cadastro. Verifique os dados e tente novamente.");
        }
      })
      .finally(function () {
        enviando = false;
        botao_cadastrar.disabled = false;
        finalizarAguardar();
      });

    return false;
  }
</script>
</body>
</html>
